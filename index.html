:root{

--bg-dark:#131a22;
--bg-light:#f8fbff;

--card-dark:rgba(31,45,58,.55);
--card-light:rgba(255,255,255,.6);

--text-dark:#ffffff;
--text-light:#1a365d;

/* основной цвет кнопок */
--accent:#42BDEC;
--accent-light:#66cff2;

/* плашка под аватаркой */

--first-dark:rgb(110,150,190);
--first-light:rgb(98,134,172);

*{

body{

margin:0;

font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;

transition:.35s;

overflow-x:hidden;

}

body.dark{
background:var(--bg-dark);
color:var(--text-dark);
}

body.light{

color:var(--text-light);
}

.container{

max-width:900px;

margin:auto;

padding:24px;

display:flex;

align-items:center;

}

/* glass cards */

.card{

border-radius:26px;

padding:22px 24px;

margin-bottom:28px;

width:100%;
max-width:700px;

backdrop-filter:blur(18px) saturate(140%);
-webkit-backdrop-filter:blur(18px) saturate(140%);

border:1px solid rgba(255,255,255,.15);

opacity:0;
transform:translateY(40px);

animation:fadeUp .7s forwards;

}

.card:nth-child(1){animation-delay:.15s;}
.card:nth-child(2){animation-delay:.35s;}
.card:nth-child(3){animation-delay:.55s;}

@keyframes fadeUp{

to{
opacity:1;
transform:translateY(0);
}

}

body.dark .card:not(:first-child){

background:var(--card-dark);

box-shadow:0 18px 40px rgba(0,0,0,.35);

}

body.light .card:not(:first-child){

background:var(--card-light);

box-shadow:0 15px 35px rgba(0,0,0,.1);

}

.card:first-child{

color:white;

}

body.dark .card:first-child{

background:var(--first-dark);
box-shadow:0 20px 45px rgba(71,113,147,.35);

}

body.light .card:first-child{

background:var(--first-light);
box-shadow:0 20px 45px rgba(71,113,147,.25);

}

.card-title{

text-align:center;

font-size:20px;

font-weight:600;

margin-top:6px;
margin-bottom:18px;

}

.avatar{

width:120px;
height:120px;

border-radius:50%;

object-fit:cover;

display:block;

margin:auto;

margin-bottom:20px;

pointer-events:none;

}

h1{

text-align:center;

margin-bottom:18px;

}

.buttons-container{

display:flex;

justify-content:center;

gap:14px;

flex-wrap:wrap;

}

/* кнопки */

.button{

display:inline-block;

padding:15px 26px;

border-radius:16px;

background:var(--accent);

color:white;

text-decoration:none;

font-weight:600;

transition:.25s;

}

.button:hover{

transform:translateY(-3px);

background:var(--accent-light);

box-shadow:0 10px 25px rgba(74,144,226,.4);

}

/* gift кнопка */

.button.secondary{

background:#6d63e6;

}

.button.secondary:hover{

background:#7b71f0;

box-shadow:0 10px 25px rgba(109,99,230,.45);

}

/* my reviews */

.button.reviews{

background:#4f8df0;

}

.button.reviews:hover{

background:#6aa3ff;

}

/* nft */

.nft-grid{

display:grid;

grid-template-columns:repeat(3,1fr);

gap:14px;

max-width:540px;

margin:auto;

}

.nft-card{

border-radius:16px;

overflow:hidden;

cursor:pointer;

position:relative;

transition:.25s;

aspect-ratio:1;

}

.nft-card img{

width:100%;
height:100%;

object-fit:cover;

pointer-events:none;

}

.nft-card:hover{

transform:translateY(-6px) scale(1.03);

box-shadow:0 16px 35px rgba(0,0,0,.45);

}

.overlay{

position:absolute;

inset:0;

background:rgba(0,0,0,.7);

display:flex;

align-items:center;

justify-content:center;

font-size:12px;

font-weight:600;

color:white;

opacity:0;

transition:.25s;

}

.nft-card:hover .overlay{

opacity:1;

}

/* footer */

.footer{

text-align:center;

margin-top:30px;

padding:18px;

font-size:13px;

opacity:.8;

}

body.light .footer a{

color:#2b6fd6;

text-decoration:none;

}

body.dark .footer a{

color:#6aa6ff;

text-decoration:none;

}

.footer a:hover{

text-decoration:underline;

}

@media(max-width:430px){

.container{
padding:16px;
}

.card{
padding:20px 16px;
}

.nft-grid{
gap:10px;
max-width:360px;

}

/* ✅ ПРАВИЛЬНЫЙ ФИКС ДЛЯ iOS 9 */

justify-content:center !important;
flex-wrap:wrap !important;
}

.button{
flex:0 0 auto !important;
}

}

<script>

function applyTheme(){

const body=document.body;

body.classList.remove("dark","light");

if(window.matchMedia){

const media=window.matchMedia("(prefers-color-scheme: dark)");

if(media.matches){
body.classList.add("dark");
}else{
body.classList.add("light");
}

media.addEventListener("change",e=>{
body.classList.remove("dark","light");
body.classList.add(e.matches?"dark":"light");
});

return;

}

const now=new Date();

const minutes=now.getHours()*60+now.getMinutes();

const darkStart=20*60;
const darkEnd=7*60+20;

if(minutes>=darkStart||minutes<=darkEnd){
body.classList.add("dark");
}else{
body.classList.add("light");
}

}

applyTheme();

document.addEventListener("contextmenu",e=>e.preventDefault());
document.addEventListener("dragstart",e=>e.preventDefault());
document.addEventListener("selectstart",e=>e.preventDefault());

</script>
