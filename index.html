body.light{

body.light .card:first-child{

}

body.dark .card:not(:first-child){

body.light .card:not(:first-child){

.avatar{

.button{

padding:14px 22px;

border-radius:16px;

background:var(--accent);
color:white;

text-decoration:none;
font-weight:600;

margin:8px;

transition:.25s;

}

.button:hover{

transform:translateY(-3px);

background:var(--accent-light);

box-shadow:0 10px 25px rgba(74,144,226,.4);

}

.button.secondary{

background:#ff4d4d;

}

.button.secondary:hover{

}

.nft-grid{

display:grid;

grid-template-columns:repeat(3,1fr);

gap:14px;

max-width:360px;

margin:auto;

}

.nft-card{

border-radius:16px;
overflow:hidden;

cursor:pointer;

position:relative;

transition:.25s;

aspect-ratio:1;

}

.nft-card img{

width:100%;
height:100%;
object-fit:cover;

}

.nft-card:hover{

transform:translateY(-6px);
box-shadow:0 16px 35px rgba(0,0,0,.45);

}

.overlay{

position:absolute;
inset:0;

background:rgba(0,0,0,.7);

display:flex;
align-items:center;
justify-content:center;

font-size:12px;
font-weight:600;

color:white;

opacity:0;

transition:.25s;

}

.nft-card:hover .overlay{

opacity:1;

}

.footer{

text-align:center;

margin-top:25px;

padding:15px;

font-size:14px;

}

body.dark .footer{

color:var(--footer-dark);

}

.footer a{

/* mobile */

<script>

function applyTheme(){

const body=document.body;

body.classList.remove("dark","light");

if(window.matchMedia){

const media=window.matchMedia("(prefers-color-scheme: dark)");

if(media.matches){
body.classList.add("dark");
}else{
body.classList.add("light");
}

media.addEventListener("change",e=>{
body.classList.remove("dark","light");
body.classList.add(e.matches?"dark":"light");
});

return;

}

const now=new Date();

const minutes=now.getHours()*60+now.getMinutes();

const darkStart=20*60;
const darkEnd=7*60+20;

if(minutes>=darkStart||minutes<=darkEnd){
body.classList.add("dark");
}else{
body.classList.add("light");
}

}

applyTheme();

</script>
