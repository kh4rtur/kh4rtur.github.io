<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>kh4rtur</title>

<style>
:root {
    --bg-dark: rgb(19,26,34);
    --bg-light: #f8fbff;
    --card-dark: #1f2d3a;
    --card-light: #ffffff;
    --text-dark: #ffffff;
    --text-light: #1a365d;
    --accent: #4a90e2;
    --accent-light: #5aa3f0;
    --first-card-bg: rgb(71, 113, 147);
    --footer-text: #6b7280;
    --glass-bg: rgba(255,255,255,0.1);
    --glass-border: rgba(255,255,255,0.2);
    --glass-blur: blur(20px);
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    transition: all 0.4s ease;
    width: 100%;
}

body.dark {
    background: var(--bg-dark);
    color: var(--text-dark);
    --footer-text: #9ca3af;
    --glass-bg: rgba(255,255,255,0.05);
    --glass-border: rgba(255,255,255,0.1);
}

body.light {
    background: var(--bg-light);
    color: var(--text-light);
    --footer-text: #6b7280;
    --glass-bg: rgba(255,255,255,0.25);
    --glass-border: rgba(255,255,255,0.4);
}

/* Кнопка-тоггл стекло */
.theme-toggle {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 1000;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: var(--glass-bg);
    backdrop-filter: var(--glass-blur);
    border: 2px solid var(--glass-border);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    color: white;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    transition: all 0.3s ease;
    user-select: none;
}

.theme-toggle:hover {
    transform: scale(1.1) rotate(180deg);
    box-shadow: 0 12px 40px rgba(74,144,226,0.4);
    background: rgba(74,144,226,0.2);
}

.theme-toggle:active {
    transform: scale(0.95);
}

.container {
    max-width: 900px;
    width: 100%;
    margin: 40px auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.card {
    border-radius: 24px;
    padding: 28px;
    margin-bottom: 30px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.1);
    transition: all 0.4s ease;
    position: relative;
    width: 100%;
    max-width: 700px;
}

.card:first-child {
    background: var(--first-card-bg) !important;
    color: white !important;
    box-shadow: 0 20px 40px rgba(71,113,147,0.3) !important;
}

body.dark .card:not(:first-child) {
    background: var(--card-dark) !important;
    box-shadow: 0 20px 40px rgba(0,0,0,0.3) !important;
}

body.light .card:not(:first-child) {
    background: var(--card-light) !important;
    box-shadow: 0 20px 40px rgba(74,144,226,0.15) !important;
}

/* Остальные стили без изменений */
.card-title {
    text-align: center; font-size: 20px; font-weight: bold; margin: 0 0 24px 0; color: inherit; line-height: 1.2;
}

.card-content { display: flex; flex-direction: column; align-items: center; gap: 0; }

.avatar { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; margin: 0 auto 20px; }

h1 { text-align: center; margin-bottom: 20px; }

.buttons-container { text-align: center; width: 100%; }

.button {
    display: inline-block; padding: 14px 24px; border-radius: 16px; background: var(--accent);
    color: white; text-decoration: none; font-weight: bold; transition: 0.3s; margin: 8px; border: 2px solid transparent;
}

.button:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(74,144,226,0.4); background: var(--accent-light); }

.button.secondary { background: #ff4d4d; }
.button.secondary:hover { background: #ff6666; box-shadow: 0 10px 20px rgba(255,77,77,0.4); }

.nft-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; width: 100%; max-width: 351px;
    margin: 0 auto; justify-items: center; justify-content: center;
}

.nft-card {
    border-radius: 16px; overflow: hidden; cursor: pointer; transition: 0.3s; position: relative;
    aspect-ratio: 1; width: 105px; height: 105px;
}

.nft-card img { width: 100%; height: 100%; object-fit: cover; display: block; }

.nft-card:hover { transform: translateY(-5px); box-shadow: 0 15px 30px rgba(0,0,0,0.4); }

.overlay {
    position: absolute; inset: 0; background: rgba(0,0,0,0.7); color: white;
    display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold;
    opacity: 0; transition: 0.3s;
}

.nft-card:hover .overlay { opacity: 1; }

.center { text-align: center; }

.footer {
    width: 100%; max-width: 900px; margin: 40px auto 30px; padding: 0 20px; text-align: center;
}

.footer-text { font-size: 14px; color: var(--footer-text); line-height: 1.4; margin: 0 0 4px 0; }

.footer-links { margin: 0; }
.footer-link { color: var(--accent); text-decoration: none; font-weight: 500; margin: 0 2px; }
.footer-link:hover { text-decoration: underline; }

/* Медиа-запросы */
@media (max-width: 430px) {
    .container { padding: 12px; margin: 20px auto; }
    .card { padding: 20px 16px; margin-bottom: 24px; max-width: 100%; }
    .card-title { font-size: 18px; margin-bottom: 20px; }
    .nft-grid { gap: 10px; max-width: 345px; }
    .nft-card { width: 105px; height: 105px; }
    .footer { margin: 30px auto 20px; padding: 0 12px; }
    .footer-text { font-size: 13px; }
    .theme-toggle { top: 10px; right: 10px; width: 50px; height: 50px; font-size: 20px; }
}

@media (min-width: 431px) and (max-width: 768px) {
    .nft-grid { gap: 16px; max-width: 420px; }
    .nft-card { width: 130px; height: 130px; }
}

@media (min-width: 769px) {
    .container { padding: 24px; }
    .card { padding: 32px; }
    .card-title { font-size: 22px; margin-bottom: 28px; }
    .nft-grid { gap: 20px; max-width: 540px; }
    .nft-card { width: 160px; height: 160px; }
}
</style>
</head>

<script>
const toggle = document.getElementById('themeToggle');

// Загрузка сохранённой темы
const savedTheme = localStorage.getItem('theme') || 'light';
document.body.classList.add(savedTheme);
toggle.textContent = savedTheme === 'dark' ? '☀️' : '🌙';

toggle.addEventListener('click', () => {
    const current = document.body.classList.contains('dark') ? 'dark' : 'light';
    const next = current === 'dark' ? 'light' : 'dark';
    
    document.body.classList.remove('dark', 'light');
    document.body.classList.add(next);
    
    toggle.textContent = next === 'dark' ? '☀️' : '🌙';
    localStorage.setItem('theme', next);
});
</script>
