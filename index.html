<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>kh4rtur</title>

<style>

/* ---------------- ROOT COLORS ---------------- */

:root{

--bg-light:#f6f8fb;
--bg-dark:#0f141a;

--card-light:#ffffff;
--card-dark:#1c2430;

--avatar-light:rgb(98,134,172);
--avatar-dark:rgb(120,160,200);

--text-light:#0f141a;
--text-dark:#ffffff;

--link-light:#1b4ed8;
--link-dark:#6ea8ff;

}

/* ---------------- BASE ---------------- */

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial;
}

body{

background:var(--bg-light);
color:var(--text-light);
display:flex;
justify-content:center;
padding:40px 16px;

}

body.dark{

background:var(--bg-dark);
color:var(--text-dark);

}

/* ---------------- WRAPPER ---------------- */

.wrapper{

width:100%;
max-width:720px;

}

/* ---------------- AVATAR CARD ---------------- */

.profile{

background:var(--avatar-light);
border-radius:28px;

padding:28px;

display:flex;
flex-direction:column;
align-items:center;

margin-bottom:22px;

}

body.dark .profile{

background:var(--avatar-dark);

}

.avatar{

width:110px;
height:110px;

border-radius:50%;
object-fit:cover;

margin-bottom:16px;

}

.username{

font-size:24px;
font-weight:700;

margin-bottom:16px;

}

/* ---------------- BUTTONS ---------------- */

.buttons{

display:flex;
gap:12px;
flex-wrap:wrap;
justify-content:center;

}

.button{

padding:12px 20px;
border-radius:14px;

font-size:15px;
font-weight:600;

text-decoration:none;
color:white;

background:#2d6cdf;

transition:.15s;

}

.button:hover{

background:#3b7cff;

}

.button.reviews{

background:#5ea0ff;

}

.button.reviews:hover{

background:#79b2ff;

}

/* ---------------- CARD ---------------- */

.card{

background:var(--card-light);

border-radius:26px;

padding:22px 24px;

margin-bottom:22px;

}

body.dark .card{

background:var(--card-dark);

}

.card-title{

text-align:center;

font-size:20px;
font-weight:600;

margin-top:6px;
margin-bottom:18px;

}

/* ---------------- LINKS ---------------- */

.links{

display:flex;
flex-direction:column;
gap:10px;

}

.link{

padding:10px 14px;

border-radius:12px;

text-decoration:none;

font-weight:500;

background:#eef3ff;
color:var(--link-light);

}

body.dark .link{

background:#273244;
color:var(--link-dark);

}

/* ---------------- NFT GRID ---------------- */

.nfts{

display:grid;
grid-template-columns:repeat(3,1fr);

gap:14px;

}

.nft{

width:100%;
border-radius:16px;

transition:.15s;

}

.nft:hover{

transform:scale(1.05);

}

/* ---------------- FOOTER ---------------- */

.footer{

text-align:center;

font-size:13px;

margin-top:12px;

}

.footer a{

text-decoration:none;

color:var(--link-light);

}

body.dark .footer a{

color:var(--link-dark);

}

.footer .chatgpt{

display:block;

margin-top:6px;

}

/* ---------------- MOBILE ---------------- */

@media (max-width:600px){

.wrapper{

max-width:460px;

}

.avatar{

width:96px;
height:96px;

}

.button{

padding:12px 18px;

font-size:15px;

}

}

</style>
</head>
