:root{

--bg-dark:#131a22;
--bg-light:#f8fbff;

--card-dark:rgba(31,45,58,.55);
--card-light:rgba(255,255,255,.6);

--text-dark:#ffffff;
--text-light:#1a365d;

--accent:#4a90e2;
--accent-light:#5aa3f0;

/* цвет верхней карточки */
--first-dark:rgb(71,113,147);

--first-light:#3d7fd1;

display:flex;
justify-content:center;

body.dark{
background:var(--bg-dark);
color:var(--text-dark);
}

body.light{

.container{

max-width:760px;

margin:auto;

padding:28px 20px;

display:flex;

flex-direction:column;

align-items:center;

}

/* glass cards */

.card{

border-radius:26px;

/* уменьшены верхние отступы */
padding:22px 28px;

margin-bottom:28px;

width:100%;

max-width:640px;

backdrop-filter:blur(18px) saturate(140%);
-webkit-backdrop-filter:blur(18px) saturate(140%);

border:1px solid rgba(255,255,255,.15);

opacity:0;
transform:translateY(40px);

animation:fadeUp .7s forwards;

}

.card:nth-child(1){animation-delay:.15s;}
.card:nth-child(2){animation-delay:.35s;}
.card:nth-child(3){animation-delay:.55s;}

@keyframes fadeUp{

to{
opacity:1;
transform:translateY(0);
}

}

body.dark .card:not(:first-child){

background:var(--card-dark);

box-shadow:0 18px 40px rgba(0,0,0,.35);

}

body.light .card:not(:first-child){

background:var(--card-light);

box-shadow:0 15px 35px rgba(0,0,0,.1);

}

.card:first-child{

color:white;

}

body.dark .card:first-child{

background:var(--first-dark);
box-shadow:0 20px 45px rgba(71,113,147,.35);

}

body.light .card:first-child{

background:var(--first-light);
box-shadow:0 20px 45px rgba(71,113,147,.25);

}

.card-title{

text-align:center;

font-size:20px;

font-weight:600;

/* уменьшен верхний отступ */
margin-top:0;
margin-bottom:18px;

}

.avatar{

width:120px;
height:120px;

border-radius:50%;

object-fit:cover;

display:block;

margin:auto;

margin-bottom:20px;

pointer-events:none;

}

h1{

text-align:center;

margin-bottom:18px;

}

.buttons-container{

text-align:center;

}

/* отдельный стиль для links */
.links-buttons{

display:flex;
justify-content:space-between;
gap:14px;

}

.button{

display:inline-block;

padding:14px 22px;

border-radius:16px;

background:var(--accent);

color:white;

text-decoration:none;

font-weight:600;

margin:8px;

transition:.25s;

}

.button:hover{

transform:translateY(-3px);

background:var(--accent-light);

box-shadow:0 10px 25px rgba(74,144,226,.4);

}

/* изменена кнопка gift from me (фиолетовая) */

.button.secondary{

background:#7a6ff0;

}

.button.secondary:hover{

background:#8b7fff;

box-shadow:0 10px 25px rgba(122,111,240,.45);

}

/* nft */

.nft-grid{

display:grid;

/* адаптивная сетка чтобы красиво выглядело на любых устройствах */
grid-template-columns:repeat(auto-fit,minmax(95px,1fr));

gap:14px;

max-width:420px;

margin:auto;

}

.nft-card{

border-radius:16px;

overflow:hidden;

cursor:pointer;

position:relative;

transition:.25s;

aspect-ratio:1;

}

.nft-card img{

width:100%;
height:100%;

object-fit:cover;

pointer-events:none;

}

.nft-card:hover{

transform:translateY(-6px) scale(1.03);

box-shadow:0 16px 35px rgba(0,0,0,.45);

}

.overlay{

position:absolute;

inset:0;

background:rgba(0,0,0,.7);

display:flex;

align-items:center;

justify-content:center;

font-size:12px;

font-weight:600;

color:white;

opacity:0;

transition:.25s;

}

.nft-card:hover .overlay{

opacity:1;

}

/* footer — сделан более незаметным */

.footer{

text-align:center;

margin-top:40px;

padding:12px;

font-size:12px;

opacity:.55;

}

.footer a{

color:inherit;
text-decoration:none;

border-bottom:1px dotted rgba(255,255,255,.3);

}

.footer a:hover{

opacity:.9;

}

/* mobile */

@media(max-width:430px){

.container{
padding:14px;
}

.card{
padding:20px 16px;
}

.nft-grid{
gap:10px;
}

}

<script>

/* theme system */

function applyTheme(){

const body=document.body;

body.classList.remove("dark","light");

if(window.matchMedia){

const media=window.matchMedia("(prefers-color-scheme: dark)");

if(media.matches){
body.classList.add("dark");
}else{
body.classList.add("light");
}

media.addEventListener("change",e=>{
body.classList.remove("dark","light");
body.classList.add(e.matches?"dark":"light");
});

return;

}

const now=new Date();

const minutes=now.getHours()*60+now.getMinutes();

const darkStart=20*60;
const darkEnd=7*60+20;

if(minutes>=darkStart||minutes<=darkEnd){
body.classList.add("dark");
}else{
body.classList.add("light");
}

}

applyTheme();


/* basic protection */

document.addEventListener("contextmenu",e=>e.preventDefault());
document.addEventListener("dragstart",e=>e.preventDefault());
document.addEventListener("selectstart",e=>e.preventDefault());

</script>
